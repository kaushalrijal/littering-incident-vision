tracker_type: bytetrack # tracker type, ['botsort', 'bytetrack']
track_high_thresh: 0.25 # threshold for the first association
track_low_thresh: 0.10 # threshold for the second association
new_track_thresh: 0.25 # threshold for initializing new track if detection does not match any existing track
track_buffer: 60 # buffer to save lost track (frames)
match_thresh: 0.8 # threshold for matching
fuse_score: True # whether to fuse confidence score with iou distance
